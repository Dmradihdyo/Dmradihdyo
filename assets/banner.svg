<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" role="img" aria-label="Damar - Electrical Engineering banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0820"/>
      <stop offset="0.55" stop-color="#2a2160"/>
      <stop offset="1" stop-color="#4b2a6e"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d6" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffe9a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9ec7">
        <animate attributeName="stop-color" values="#ff9ec7;#67e8f9;#ff9ec7" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#67e8f9">
        <animate attributeName="stop-color" values="#67e8f9;#ff9ec7;#67e8f9" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="petal" d="M0,0 C6,-7 15,-5 13,4 C11,13 2,13 0,0Z" fill="#ffb7d5" opacity="0.9"/>
  </defs>

  <rect width="900" height="320" fill="url(#sky)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="90" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="30" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="70" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="25" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="60" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="28" r="1.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="45" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="130" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="150" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- shooting star -->
  <g>
    <line x1="0" y1="0" x2="-60" y2="-24" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;1" dur="7s" repeatCount="indefinite"/>
    </line>
    <animateMotion path="M420,20 L120,140" dur="7s" repeatCount="indefinite" begin="1s"/>
  </g>

  <!-- moon -->
  <circle cx="745" cy="95" r="95" fill="url(#moonGlow)">
    <animate attributeName="r" values="90;100;90" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="745" cy="95" r="40" fill="#fff4cf"/>
  <circle cx="732" cy="86" r="7" fill="#f3e2a9" opacity="0.7"/>
  <circle cx="757" cy="108" r="5" fill="#f3e2a9" opacity="0.7"/>

  <!-- far hills -->
  <path d="M0,260 C120,220 220,250 340,235 C470,218 560,255 680,240 C780,228 850,245 900,236 L900,320 L0,320Z" fill="#241749"/>
  <path d="M0,285 C150,262 260,288 400,272 C540,256 660,290 790,272 C850,265 880,272 900,270 L900,320 L0,320Z" fill="#170f32"/>

  <!-- torii gate -->
  <g fill="#0c0718" stroke="#ff6b9c" stroke-width="1.2" stroke-opacity="0.7">
    <path d="M690,150 C720,162 770,162 800,150 L806,143 C770,155 720,155 684,143Z"/>
    <rect x="696" y="160" width="8" height="125"/>
    <rect x="786" y="160" width="8" height="125"/>
    <rect x="690" y="178" width="110" height="7"/>
  </g>

  <!-- title -->
  <g filter="url(#glow)">
    <text x="60" y="165" font-family="'Segoe UI','Noto Sans JP',Arial,sans-serif" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="6">DAMAR</text>
  </g>
  <text x="64" y="105" font-family="'Noto Sans JP','Yu Gothic','Segoe UI',sans-serif" font-size="22" fill="#ffc2dc" letter-spacing="8">ようこそ</text>
  <text x="64" y="205" font-family="'Fira Code','Consolas',monospace" font-size="17" fill="#c9d6ff">Electrical Engineering • IoT • Network • Cloud • Cyber</text>
  <text x="64" y="238" font-family="'Fira Code','Consolas',monospace" font-size="15" fill="#8be9fd">&gt; turning circuits into stories<tspan>_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>

  <!-- falling sakura petals -->
  <g>
    <g transform="translate(80,0)"><g><animateMotion path="M0,-20 C40,80 -30,170 30,350" dur="9s" repeatCount="indefinite" begin="-1s"/><use href="#petal"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/></use></g></g>
    <g transform="translate(210,0)"><g><animateMotion path="M0,-20 C-40,90 40,180 -20,350" dur="11s" repeatCount="indefinite" begin="-5s"/><use href="#petal"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/></use></g></g>
    <g transform="translate(350,0)"><g><animateMotion path="M0,-20 C50,70 -20,190 40,350" dur="10s" repeatCount="indefinite" begin="-3s"/><use href="#petal"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.5s" repeatCount="indefinite"/></use></g></g>
    <g transform="translate(470,0)"><g><animateMotion path="M0,-20 C-30,100 50,170 0,350" dur="12s" repeatCount="indefinite" begin="-8s"/><use href="#petal"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/></use></g></g>
    <g transform="translate(580,0)"><g><animateMotion path="M0,-20 C40,60 -40,200 30,350" dur="8.5s" repeatCount="indefinite" begin="-2s"/><use href="#petal"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4.5s" repeatCount="indefinite"/></use></g></g>
    <g transform="translate(660,0)"><g><animateMotion path="M0,-20 C-50,90 30,160 -30,350" dur="10.5s" repeatCount="indefinite" begin="-6s"/><use href="#petal"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5.5s" repeatCount="indefinite"/></use></g></g>
    <g transform="translate(850,0)"><g><animateMotion path="M0,-20 C-40,80 30,180 -40,350" dur="9.5s" repeatCount="indefinite" begin="-4s"/><use href="#petal"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/></use></g></g>
    <g transform="translate(20,0)"><g><animateMotion path="M0,-20 C30,100 -20,170 20,350" dur="13s" repeatCount="indefinite" begin="-9s"/><use href="#petal"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/></use></g></g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
